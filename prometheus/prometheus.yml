global:
  scrape_interval: 15s # Khoảng thời gian cào metrics định kỳ

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    metric_relabel_configs:
      - source_labels: [container_label_com_docker_compose_project]
        regex: 'taxi-booking'
        action: keep

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'taxi-web-app'
    metrics_path: /metrics
    static_configs:
      - targets: ['web-app:3000']